<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Future Travel Mission ✈️ – Far and Away</title>
<meta name="description" content="An interactive English grammar journey across Saudi Arabia – Mega Goal 2, Unit 3: Far and Away." />
<meta property="og:title" content="Future Travel Mission ✈️ – Far and Away" />
<meta property="og:description" content="Travel from Jeddah to Riyadh and complete 12 English challenges about the future." />
<meta name="theme-color" content="#2BB5B0" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --pink: #F28DB2;
    --pink-d: #D9567F;
    --pink-l: #FCE1EB;
    --teal: #2BB5B0;
    --teal-d: #137F7E;
    --teal-l: #D4F1EF;
    --beige: #F8EEDF;
    --sand: #E9D3B4;
    --sand-d: #C9A97E;
    --ink: #3B2F3F;
    --ok: #2E9E6A;
    --bad: #E0475E;
    --u: min(1vw, 1.7778vh); /* 1% of stage width */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Fredoka", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 20%, rgba(242,141,178,.35), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(43,181,176,.35), transparent 40%),
      #EBDCC6;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }

  /* ---------- 16:9 stage ---------- */
  .stage {
    position: relative;
    width: calc(var(--u) * 100);
    height: calc(var(--u) * 56.25);
    background: var(--beige);
    background-image:
      radial-gradient(rgba(201,169,126,.25) 1px, transparent 1.4px);
    background-size: calc(var(--u) * 2) calc(var(--u) * 2);
    border-radius: calc(var(--u) * 1.6);
    box-shadow: 0 calc(var(--u)*1) calc(var(--u)*4) rgba(59,47,63,.25);
    overflow: hidden;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }
  @media (max-aspect-ratio: 4/5) {
    /* phones held upright: keep the game usable full-screen */
    :root { --u: 2.5vw; }
    body { overflow: auto; align-items: stretch; }
    .stage { width: 100vw; height: auto; min-height: 100dvh; border-radius: 0; }
  }

  /* ---------- Header ---------- */
  .topbar {
    display: flex; align-items: center; gap: calc(var(--u)*2);
    padding: calc(var(--u)*1.2) calc(var(--u)*2.4);
    background: #fff8;
    border-bottom: calc(var(--u)*.25) dashed var(--sand-d);
  }
  .brand { font-weight: 700; font-size: calc(var(--u)*1.8); white-space: nowrap; color: var(--teal-d); }
  .brand span { font-family: "Caveat", cursive; color: var(--pink-d); font-size: 1.2em; margin-left: .2em; }
  .progress { flex: 1; display: flex; gap: calc(var(--u)*.4); align-items: center; }
  .seg {
    flex: 1; height: calc(var(--u)*1.2); border-radius: 99px;
    background: #fff; border: calc(var(--u)*.18) solid var(--sand-d);
    transition: background .4s;
  }
  .seg.gap { margin-right: calc(var(--u)*.8); }
  .seg.done { background: var(--teal); border-color: var(--teal-d); }
  .seg.miss { background: var(--pink); border-color: var(--pink-d); }
  .seg.now { animation: pulse 1.2s infinite; border-color: var(--pink-d); }
  @keyframes pulse { 50% { background: var(--pink-l); } }
  .score-pill {
    background: var(--pink); color: #fff; font-weight: 700;
    font-size: calc(var(--u)*1.8); padding: calc(var(--u)*.5) calc(var(--u)*1.6);
    border-radius: 99px; border: calc(var(--u)*.25) solid var(--pink-d);
    white-space: nowrap;
  }
  .score-pill.bump { animation: bump .5s; }
  @keyframes bump { 40% { transform: scale(1.25) rotate(-4deg); } }

  .footer {
    text-align: center; padding: calc(var(--u)*.7);
    font-size: calc(var(--u)*1.5); color: var(--teal-d);
    border-top: calc(var(--u)*.25) dashed var(--sand-d);
    background: #fff6;
  }
  .footer b { font-family: "Caveat", cursive; font-size: 1.35em; color: var(--pink-d); }

  /* ---------- Screens ---------- */
  #screen { position: relative; overflow: hidden; }
  .screen {
    position: absolute; inset: 0;
    padding: calc(var(--u)*2) calc(var(--u)*3);
    animation: enter .45s ease both;
  }
  @media (max-aspect-ratio: 4/5) { .screen { position: relative; min-height: 100%; } }
  @keyframes enter { from { opacity: 0; transform: translateY(calc(var(--u)*2)); } }

  .btn {
    border: calc(var(--u)*.3) solid var(--ink);
    background: var(--teal); color: #fff; font-weight: 700;
    font-size: calc(var(--u)*2.4);
    padding: calc(var(--u)*1) calc(var(--u)*3.2);
    border-radius: calc(var(--u)*1.6) calc(var(--u)*1.2) calc(var(--u)*1.8) calc(var(--u)*1.1);
    box-shadow: calc(var(--u)*.4) calc(var(--u)*.5) 0 var(--ink);
    transition: transform .12s, box-shadow .12s;
  }
  .btn:hover { transform: translate(-1px,-2px); }
  .btn:active { transform: translate(calc(var(--u)*.4), calc(var(--u)*.5)); box-shadow: 0 0 0 var(--ink); }
  .btn.pink { background: var(--pink-d); }
  .btn.ghost { background: #fff; color: var(--ink); }
  .btn:disabled { opacity: .45; pointer-events: none; }

  .rough { filter: url(#rough); }

  /* Start */
  .start { display: grid; grid-template-columns: 1.1fr 1fr; align-items: center; gap: calc(var(--u)*3); }
  .start h1 { margin: 0; font-size: calc(var(--u)*5.2); line-height: 1; color: var(--teal-d); }
  .start h1 .sub { display: block; font-family: "Caveat", cursive; color: var(--pink-d); font-size: .8em; margin-top: calc(var(--u)*.8); }
  .tagline { font-size: calc(var(--u)*2); margin: calc(var(--u)*1.6) 0; line-height: 1.4; }
  .chips { display: flex; flex-wrap: wrap; gap: calc(var(--u)*.8); margin-bottom: calc(var(--u)*2.4); }
  .chip {
    background: #fff; border: calc(var(--u)*.2) solid var(--sand-d); border-radius: 99px;
    padding: calc(var(--u)*.4) calc(var(--u)*1.2); font-size: calc(var(--u)*1.5); font-weight: 500;
  }
  .ticket {
    position: relative; background: #fff; border: calc(var(--u)*.3) solid var(--ink);
    border-radius: calc(var(--u)*2); padding: calc(var(--u)*2); transform: rotate(2deg);
    box-shadow: calc(var(--u)*.6) calc(var(--u)*.8) 0 var(--pink);
  }
  .ticket .t-head { display: flex; justify-content: space-between; font-weight: 700; color: var(--pink-d); font-size: calc(var(--u)*1.6); letter-spacing: .1em; }
  .ticket .route { display: flex; justify-content: space-between; align-items: center; margin: calc(var(--u)*1.2) 0; }
  .ticket .code { font-size: calc(var(--u)*4); font-weight: 700; color: var(--teal-d); line-height: 1; }
  .ticket .code small { display: block; font-size: calc(var(--u)*1.3); color: var(--ink); font-weight: 500; }
  .ticket .stops { display: grid; grid-template-columns: repeat(4,1fr); gap: calc(var(--u)*.6); margin-top: calc(var(--u)*1); }
  .ticket .stop { background: var(--teal-l); border-radius: calc(var(--u)*1); padding: calc(var(--u)*.6); text-align: center; font-size: calc(var(--u)*1.4); font-weight: 600; }
  .ticket .perf { border-top: calc(var(--u)*.3) dashed var(--sand-d); margin: calc(var(--u)*1.2) 0 calc(var(--u)*.8); }
  .ticket .barcode { height: calc(var(--u)*3); background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 5px, var(--ink) 5px 6px, transparent 6px 9px); border-radius: 4px; }

  /* Map */
  .map-wrap { display: grid; grid-template-columns: 1fr 1.25fr; gap: calc(var(--u)*3); height: 100%; align-items: center; }
  .map-wrap h2 { margin: 0 0 calc(var(--u)*1); font-size: calc(var(--u)*3.6); color: var(--teal-d); }
  .map-wrap p { font-size: calc(var(--u)*1.9); line-height: 1.4; margin: 0 0 calc(var(--u)*1.6); }
  .legs { display: grid; gap: calc(var(--u)*.8); }
  .leg {
    display: flex; align-items: center; gap: calc(var(--u)*1.2); background: #fff;
    border: calc(var(--u)*.22) solid var(--sand-d); border-radius: calc(var(--u)*1.2);
    padding: calc(var(--u)*.6) calc(var(--u)*1.2); font-size: calc(var(--u)*1.7);
  }
  .leg .n { width: calc(var(--u)*3); height: calc(var(--u)*3); border-radius: 50%; display: grid; place-items: center; background: var(--sand); font-weight: 700; flex: none; }
  .leg.done .n { background: var(--teal); color: #fff; }
  .leg.next { border-color: var(--pink-d); box-shadow: 0 0 0 calc(var(--u)*.3) var(--pink-l); }
  .leg.next .n { background: var(--pink-d); color: #fff; }
  .leg .meta { margin-left: auto; font-weight: 600; color: var(--teal-d); white-space: nowrap; }
  .leg small { display: block; font-size: .8em; opacity: .75; }
  .map { position: relative; width: min(100%, calc(var(--u)*50)); margin: 0 auto; aspect-ratio: 100 / 82; max-height: 100%; }
  .map svg { width: 100%; height: 100%; display: block; }
  .pin {
    position: absolute; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*.3);
    background: none; border: 0; padding: 0;
  }
  .pin .dot {
    width: calc(var(--u)*5); height: calc(var(--u)*5); border-radius: 50%;
    display: grid; place-items: center; font-size: calc(var(--u)*2.4);
    background: #fff; border: calc(var(--u)*.3) solid var(--ink);
    box-shadow: calc(var(--u)*.3) calc(var(--u)*.4) 0 var(--ink);
  }
  .pin .lbl { background: var(--ink); color: #fff; font-weight: 600; font-size: calc(var(--u)*1.5); padding: calc(var(--u)*.2) calc(var(--u)*.9); border-radius: 99px; }
  .pin.done .dot { background: var(--teal); color: #fff; }
  .pin.next .dot { background: var(--pink); animation: hop 1.4s infinite; }
  .pin.locked { cursor: not-allowed; opacity: .75; }
  .pin.locked .dot { background: var(--sand); }
  @keyframes hop { 50% { transform: translateY(calc(var(--u)*-.8)); } }

  /* Station intro */
  .intro { display: grid; grid-template-columns: 1fr 1.2fr; gap: calc(var(--u)*3); align-items: center; height: 100%; }
  .postcard {
    background: #fff; border: calc(var(--u)*.3) solid var(--ink); border-radius: calc(var(--u)*1.6);
    padding: calc(var(--u)*1.4); transform: rotate(-2.5deg);
    box-shadow: calc(var(--u)*.6) calc(var(--u)*.8) 0 var(--teal);
  }
  .postcard .art { border-radius: calc(var(--u)*1); overflow: hidden; aspect-ratio: 4/3; }
  .postcard .art svg { width: 100%; height: 100%; display: block; }
  .postcard .cap { font-family: "Caveat", cursive; font-size: calc(var(--u)*3); text-align: center; margin-top: calc(var(--u)*.6); color: var(--pink-d); }
  .kicker { font-weight: 700; color: var(--pink-d); letter-spacing: .12em; font-size: calc(var(--u)*1.6); text-transform: uppercase; }
  .intro h2 { margin: calc(var(--u)*.4) 0 calc(var(--u)*1); font-size: calc(var(--u)*4); line-height: 1.05; color: var(--teal-d); }
  .intro p { font-size: calc(var(--u)*2); line-height: 1.45; margin: 0 0 calc(var(--u)*1.4); }
  .rule {
    background: var(--teal-l); border-left: calc(var(--u)*.7) solid var(--teal);
    border-radius: calc(var(--u)*1); padding: calc(var(--u)*1.2) calc(var(--u)*1.6);
    font-size: calc(var(--u)*1.8); line-height: 1.45; margin-bottom: calc(var(--u)*2);
  }
  .rule b { color: var(--teal-d); }

  /* Question */
  .quiz { display: grid; grid-template-columns: calc(var(--u)*22) 1fr; gap: calc(var(--u)*3); height: 100%; }
  .side { display: flex; flex-direction: column; gap: calc(var(--u)*1.2); }
  .side .postcard { transform: rotate(-2deg); padding: calc(var(--u)*1); }
  .side .postcard .cap { font-size: calc(var(--u)*2.4); margin-top: calc(var(--u)*.2); }
  .qcount { font-weight: 700; font-size: calc(var(--u)*1.7); text-align: center; color: var(--teal-d); }
  .qdots { display: flex; justify-content: center; gap: calc(var(--u)*.8); }
  .qdots i { width: calc(var(--u)*1.6); height: calc(var(--u)*1.6); border-radius: 50%; background: #fff; border: calc(var(--u)*.22) solid var(--ink); }
  .qdots i.on { background: var(--pink); }
  .qdots i.ok { background: var(--teal); }
  .main { display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u)*1.6); min-width: 0; }
  .instr { font-weight: 600; color: var(--pink-d); font-size: calc(var(--u)*1.9); }
  .context {
    background: #fff; border: calc(var(--u)*.22) dashed var(--sand-d); border-radius: calc(var(--u)*1.2);
    padding: calc(var(--u)*1) calc(var(--u)*1.6); font-size: calc(var(--u)*2); line-height: 1.4;
  }
  .sentence { font-size: calc(var(--u)*3.1); font-weight: 600; line-height: 1.35; }
  .blank {
    display: inline-block; min-width: calc(var(--u)*9); text-align: center;
    border-bottom: calc(var(--u)*.35) solid var(--pink-d); color: var(--pink-d); padding: 0 calc(var(--u)*.6);
  }
  .blank.filled { color: var(--ok); border-color: var(--ok); }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(var(--u)*18), 1fr)); gap: calc(var(--u)*1.2); }
  .opt {
    background: #fff; border: calc(var(--u)*.3) solid var(--ink);
    border-radius: calc(var(--u)*1.4) calc(var(--u)*1) calc(var(--u)*1.6) calc(var(--u)*1.1);
    box-shadow: calc(var(--u)*.35) calc(var(--u)*.45) 0 var(--ink);
    font-size: calc(var(--u)*2.4); font-weight: 600; padding: calc(var(--u)*1.1) calc(var(--u)*1);
    transition: transform .12s, background .2s, box-shadow .12s;
  }
  .opt small { display: block; font-size: .62em; font-weight: 500; opacity: .8; margin-top: calc(var(--u)*.3); }
  .opt:hover { background: var(--pink-l); }
  .opt:active { transform: translate(calc(var(--u)*.35), calc(var(--u)*.45)); box-shadow: none; }
  .opt.wrong { background: #FBD5DB; border-color: var(--bad); color: var(--bad); box-shadow: none; text-decoration: line-through; pointer-events: none; animation: shake .4s; }
  .opt.right { background: var(--teal); color: #fff; pointer-events: none; animation: pop .4s; }
  .opts.locked .opt:not(.right) { opacity: .45; pointer-events: none; }
  @keyframes shake { 20%,60% { transform: translateX(calc(var(--u)*-.8)); } 40%,80% { transform: translateX(calc(var(--u)*.8)); } }
  @keyframes pop { 50% { transform: scale(1.06); } }

  /* word order */
  .build {
    min-height: calc(var(--u)*7); background: #fff; border: calc(var(--u)*.3) dashed var(--teal);
    border-radius: calc(var(--u)*1.4); padding: calc(var(--u)*1); display: flex; flex-wrap: wrap; gap: calc(var(--u)*.8); align-items: center;
  }
  .build.empty::before { content: "Tap the words in the correct order…"; color: #9b8f96; font-size: calc(var(--u)*1.8); padding-left: calc(var(--u)*.6); }
  .build.wrong { border-color: var(--bad); animation: shake .4s; }
  .build.right { border-color: var(--ok); border-style: solid; background: #E3F6EE; }
  .bank { display: flex; flex-wrap: wrap; gap: calc(var(--u)*1); justify-content: center; min-height: calc(var(--u)*5.5); }
  .word {
    background: var(--pink-l); border: calc(var(--u)*.25) solid var(--ink); border-radius: calc(var(--u)*1);
    font-size: calc(var(--u)*2.4); font-weight: 600; padding: calc(var(--u)*.6) calc(var(--u)*1.4);
    box-shadow: calc(var(--u)*.25) calc(var(--u)*.35) 0 var(--ink);
  }
  .build .word { background: var(--teal-l); }
  .row { display: flex; gap: calc(var(--u)*1.2); align-items: center; flex-wrap: wrap; }

  .feedback {
    min-height: calc(var(--u)*6); display: flex; align-items: center; gap: calc(var(--u)*1.6);
    border-radius: calc(var(--u)*1.4); padding: calc(var(--u)*1) calc(var(--u)*1.6);
    font-size: calc(var(--u)*1.9); line-height: 1.35; visibility: hidden;
  }
  .feedback.show { visibility: visible; animation: enter .3s both; }
  .feedback.good { background: #E3F6EE; border: calc(var(--u)*.25) solid var(--ok); }
  .feedback.bad { background: #FDE6EA; border: calc(var(--u)*.25) solid var(--bad); }
  .feedback .em { font-size: calc(var(--u)*3.4); }
  .feedback .txt { flex: 1; }
  .feedback b { display: block; font-size: 1.15em; }
  .feedback .btn { font-size: calc(var(--u)*2); padding: calc(var(--u)*.8) calc(var(--u)*2.2); }

  /* Station complete / final */
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; height: 100%; gap: calc(var(--u)*1.4); }
  .center h2 { margin: 0; font-size: calc(var(--u)*4.4); color: var(--teal-d); }
  .center p { margin: 0; font-size: calc(var(--u)*2.1); max-width: calc(var(--u)*70); line-height: 1.45; }
  .stamp {
    width: calc(var(--u)*16); height: calc(var(--u)*16); border-radius: 50%;
    border: calc(var(--u)*.6) double var(--pink-d); color: var(--pink-d);
    display: grid; place-items: center; text-align: center; font-weight: 700;
    font-size: calc(var(--u)*1.7); line-height: 1.2; transform: rotate(-12deg);
    animation: stampIn .6s cubic-bezier(.2,1.6,.4,1) both; background: #fff8;
  }
  .stamp big { display: block; font-size: calc(var(--u)*3.4); font-family: "Caveat", cursive; }
  @keyframes stampIn { from { transform: scale(2.4) rotate(-30deg); opacity: 0; } }
  .bigscore { font-size: calc(var(--u)*9); font-weight: 700; color: var(--pink-d); line-height: 1; }
  .bigscore small { font-size: .4em; color: var(--ink); }
  .stars { font-size: calc(var(--u)*4.4); letter-spacing: calc(var(--u)*.6); }
  .passport { display: flex; gap: calc(var(--u)*1.6); flex-wrap: wrap; justify-content: center; }
  .pstamp {
    border: calc(var(--u)*.3) dashed var(--teal-d); border-radius: calc(var(--u)*1.2); padding: calc(var(--u)*.6) calc(var(--u)*1.4);
    background: #fff; font-weight: 600; font-size: calc(var(--u)*1.6); transform: rotate(var(--r));
  }
  .pstamp b { color: var(--pink-d); display: block; font-size: 1.3em; }

  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti i { position: absolute; top: -5%; width: calc(var(--u)*1); height: calc(var(--u)*1.6); border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(70vh) rotate(720deg); opacity: .2; } }

  .sound-btn {
    background: #fff; border: calc(var(--u)*.22) solid var(--sand-d); border-radius: 50%;
    width: calc(var(--u)*4); height: calc(var(--u)*4); font-size: calc(var(--u)*1.9); flex: none;
  }

  @media (max-aspect-ratio: 4/5) {
    .start, .map-wrap, .intro, .quiz { grid-template-columns: 1fr; height: auto; }
    .start { padding-top: calc(var(--u)*2); }
    .quiz .side { flex-direction: row; align-items: center; }
    .quiz .side .postcard { width: 40%; }
    .quiz .side .side-info { flex: 1; }
    .brand { display: none; }
    .ticket { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
</svg>

<div class="stage" id="stage">
  <header class="topbar">
    <div class="brand">Future Travel Mission <span>Far and Away</span></div>
    <div class="progress" id="progress" aria-label="Mission progress"></div>
    <div class="score-pill" id="score" aria-live="polite">⭐ 0 / 12</div>
    <button class="sound-btn" id="soundBtn" aria-label="Toggle sound">🔊</button>
  </header>
  <main id="screen"></main>
  <footer class="footer">Mega Goal 2 · Unit 3 &nbsp;·&nbsp; Teacher: <b>Ghaliah Al-Shamrani</b></footer>
</div>

<script>
/* =========================================================
   Hand-drawn station art (simple SVG, roughened by #rough)
   ========================================================= */
const ART = {
  jeddah: `<svg viewBox="0 0 160 120" aria-hidden="true">
    <rect width="160" height="120" fill="#FCE1EB"/>

/* =========================================================
   Sound (tiny Web Audio tones, no files)
   ========================================================= */
let soundOn = true, actx = null;
function tone(freqs, dur = 0.12, type = "triangle") {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * dur;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
    });
  } catch (e) {}
}
const sfx = {
  tap: () => tone([520], 0.06),
  good: () => tone([523, 659, 784], 0.11),
  bad: () => tone([220, 180], 0.14, "sawtooth"),
  win: () => tone([523, 659, 784, 1047, 784, 1047], 0.13)
};
document.getElementById("soundBtn").onclick = (e) => {
  soundOn = !soundOn; e.currentTarget.textContent = soundOn ? "🔊" : "🔇";
};

let S;
function reset() {
  S = {
    station: 0, q: 0, score: 0,
    unlocked: 0,                                   // highest station index the student may enter
    results: STATIONS.map(s => s.questions.map(() => null)), // true = first try, false = needed retry
    tries: 0, solved: false, built: []
  };
}
reset();

const $screen = document.getElementById("screen");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const optVal = o => typeof o === "string" ? o : o.v;
const optLabel = o => typeof o === "string" ? o : o.label;

function render(html) {
  $screen.innerHTML = `<section class="screen">${html}</section>`;
  updateHud();
}

function updateHud(bump) {
  const p = document.getElementById("progress");
  let html = "", idx = 0;
  STATIONS.forEach((st, si) => st.questions.forEach((_, qi) => {
    const r = S.results[si][qi];
    let c = r === true ? "done" : r === false ? "miss" : "";
    if (r === null && si === S.station && qi === S.q && $screen.querySelector(".quiz")) c = "now";
    if (qi === st.questions.length - 1 && si < STATIONS.length - 1) c += " gap";
    html += `<div class="seg ${c}" title="${st.city} · Q${qi + 1}"></div>`; idx++;
  }));
  p.innerHTML = html;
  const sc = document.getElementById("score");
  sc.textContent = `⭐ ${S.score} / ${TOTAL}`;
  if (bump) { sc.classList.remove("bump"); void sc.offsetWidth; sc.classList.add("bump"); }
}

function showQuestion() {

  const dots = s.questions.map((_, i) => `<i class="${S.results[S.station][i] !== null ? "ok" : i === S.q ? "on" : ""}"></i>`).join("");
  let body = "";
  if (q.type === "mcq") {
    const opts = q.fixed ? q.options : shuffle(q.options);
    body = `
      ${q.context ? `<div class="context">${q.context}</div>` : ""}
      <div class="sentence">${q.sentence.replace("___", `<span class="blank" id="blank">?</span>`)}</div>
      <div class="opts" id="opts">${opts.map(o => `<button class="opt" data-v="${optVal(o)}" data-l="${optLabel(o)}">${optLabel(o)}${o.sub ? `<small>${o.sub}</small>` : ""}</button>`).join("")}</div>`;
  } else {
    S.bank = shuffle(q.words.map((w, i) => ({ w, id: i })));
    // avoid starting in the correct order
    while (S.bank.map(b => b.w).join() === q.answer.join()) S.bank = shuffle(S.bank);
    body = `
      <div class="build empty" id="build" aria-label="Your sentence"></div>
      <div class="bank" id="bank"></div>
      <div class="row"><button class="btn" id="check" disabled>Check ✓</button><button class="btn ghost" id="clear">↺ Reset</button></div>`;

        <div class="side-info">
          <div class="qcount">${s.title}<br>Question ${S.q + 1} of ${s.questions.length}</div>
          <div class="qdots" style="margin-top:calc(var(--u)*.8)">${dots}</div>
        </div>
      </aside>
      <div class="main">
        <div class="instr">${q.instr}</div>
        ${body}
        <div class="feedback" id="fb" aria-live="polite"></div>
      </div>
    </div>`);

  if (q.type === "mcq") {
    $screen.querySelectorAll(".opt").forEach(b => b.onclick = () => answerMcq(b, q));
  } else {
    drawOrder(q);
    $screen.querySelector("#check").onclick = () => checkOrder(q);
    $screen.querySelector("#clear").onclick = () => { sfx.tap(); S.built = []; drawOrder(q); };
  }
}

function answerMcq(btn, q) {
  if (S.solved) return;
  S.tries++;
  if (btn.dataset.v === q.answer) {
    btn.classList.add("right");
    $screen.querySelector("#opts").classList.add("locked");
    const blank = $screen.querySelector("#blank");
    if (blank) { blank.textContent = btn.dataset.l; blank.classList.add("filled"); }
    solved(q);
  } else {
    btn.classList.add("wrong");
    wrong(q);
  }
}

function drawOrder(q) {
  const build = $screen.querySelector("#build"), bank = $screen.querySelector("#bank");
  build.classList.remove("wrong");
  build.classList.toggle("empty", S.built.length === 0);
  build.innerHTML = S.built.map(b => `<button class="word" data-id="${b.id}">${b.w}</button>`).join("") +
    (S.built.length === q.words.length ? `<span class="sentence" style="font-size:calc(var(--u)*2.6)">${q.end}</span>` : "");
  bank.innerHTML = S.bank.filter(b => !S.built.includes(b)).map(b => `<button class="word" data-id="${b.id}">${b.w}</button>`).join("");
  $screen.querySelector("#check").disabled = S.built.length !== q.words.length || S.solved;
  if (S.solved) return;
  bank.querySelectorAll(".word").forEach(el => el.onclick = () => {
    sfx.tap(); S.built.push(S.bank.find(b => b.id === +el.dataset.id)); drawOrder(q); hideFb();
  });
  build.querySelectorAll(".word").forEach(el => el.onclick = () => {
    sfx.tap(); S.built = S.built.filter(b => b.id !== +el.dataset.id); drawOrder(q); hideFb();
  });
}

function checkOrder(q) {
  if (S.solved) return;
  S.tries++;
  const build = $screen.querySelector("#build");
  if (S.built.map(b => b.w).join(" ") === q.answer.join(" ")) {
    solved(q);
    drawOrder(q);
    build.classList.add("right");
    $screen.querySelector("#clear").disabled = true;
  } else {
    build.classList.remove("wrong"); void build.offsetWidth; build.classList.add("wrong");
    wrong(q);
  }
}

function hideFb() { const fb = $screen.querySelector("#fb"); if (fb && !S.solved) fb.className = "feedback"; }

function wrong(q) {
  sfx.bad();
  const fb = $screen.querySelector("#fb");
  fb.className = "feedback bad"; void fb.offsetWidth; fb.classList.add("show");
  fb.innerHTML = `<span class="em">🤔</span><span class="txt"><b>Not quite – try again!</b>💡 ${q.hint}</span>`;
}

function solved(q) {
  S.solved = true;
  const first = S.tries === 1;
  S.results[S.station][S.q] = first;
  if (first) S.score++;
  sfx.good();
  updateHud(first);
  const s = STATIONS[S.station];
  const last = S.q === s.questions.length - 1;
  const fb = $screen.querySelector("#fb");
  const praise = first ? ["Excellent!", "Brilliant!", "Perfect!", "Well done!"][Math.random() * 4 | 0] + " +1 ⭐" : "Correct! Great job not giving up.";
  fb.className = "feedback good show";
  fb.innerHTML = `<span class="em">${first ? "🎉" : "👏"}</span><span class="txt"><b>${praise}</b>${q.explain}</span>
    <button class="btn" id="next">${last ? "Finish Station 🏁" : "Next ➜"}</button>`;
  fb.querySelector("#next").onclick = () => {
    sfx.tap();
    if (last) showStationDone(); else { S.q++; showQuestion(); }
  };
}

/* ---------- Station complete ---------- */
function showStationDone() {
  const i = S.station, s = STATIONS[i];
  const pts = S.results[i].filter(Boolean).length;
  if (S.unlocked === i && i < STATIONS.length - 1) S.unlocked = i + 1;
  const lastStation = i === STATIONS.length - 1;
  sfx.win();
  render(`
    <div class="center">
      <div class="stamp">${s.code}<big>${s.city}</big>VISITED ✓</div>
      <h2>${s.city} challenge complete!</h2>
      <p>You earned <b>${pts} out of 3</b> stars at this station. ${pts === 3 ? "Flawless flying! ✨" : "Every mistake helps you learn – keep going! 💪"}</p>
      <button class="btn pink" id="go">${lastStation ? "See My Final Score 🏆" : `Fly to ${STATIONS[i + 1].city} ✈️`}</button>
    </div>`);
  $screen.querySelector("#go").onclick = () => { sfx.tap(); lastStation ? showFinal() : showMap(); };
}

/* ---------- Final ---------- */
function showFinal() {
  const sc = S.score;
  const stars = sc >= 11 ? 3 : sc >= 8 ? 2 : 1;
  const msg = sc === 12 ? ["Perfect mission! 🏆", "Amazing! You are a true future-tense expert. Your English is ready for any journey!"]
    : sc >= 10 ? ["Outstanding traveller! 🌟", "Fantastic work! You really understand how to talk about the future."]
    : sc >= 7 ? ["Great journey! ✈️", "Well done! You're on the right track – review the tricky stations and fly again."]
    : ["Brave explorer! 💪", "You finished the whole mission! Practise a little more and play again – you'll soar higher next time."];
  sfx.win();
  render(`
    <div class="center">
      <div class="kicker">Mission Report</div>
      <h2>${msg[0]}</h2>
      <div class="bigscore">${sc}<small> / ${TOTAL}</small></div>
      <div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</div>
      <p>${msg[1]}</p>
      <div class="passport">${STATIONS.map((s, i) => `<div class="pstamp" style="--r:${[-4, 3, -2, 4][i]}deg"><b>${s.emoji} ${s.city}</b>${S.results[i].filter(Boolean).length} / 3</div>`).join("")}</div>
      <button class="btn pink" id="again">Play Again 🔁</button>
    </div>
    <div class="confetti">${Array.from({ length: 40 }, () => `<i style="left:${Math.random() * 100}%;background:${["#F28DB2", "#2BB5B0", "#E9D3B4", "#D9567F", "#F9C66B"][Math.random() * 5 | 0]};animation-duration:${2 + Math.random() * 2.5}s;animation-delay:${Math.random() * 1.2}s"></i>`).join("")}</div>`);
  $screen.querySelector("#again").onclick = () => { sfx.tap(); showStart(); };
}

showStart();
</script>
</body>
</html>
